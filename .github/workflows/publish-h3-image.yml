name: publish-h3-runtime-image

on:
  workflow_dispatch:
  push:
    tags:
      - h3-image-v*

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/solarwm-h3

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf \
            /opt/hostedtoolcache \
            /usr/local/lib/android \
            /usr/local/.ghcup \
            /usr/share/dotnet \
            /usr/share/swift
          docker system prune --all --force
          df -h

      - name: Add swap for FlashAttention compilation
        run: |
          sudo swapoff /mnt/swapfile 2>/dev/null || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
          swapon --show

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=h3-cu124-latest
            type=sha,prefix=h3-cu124-sha-
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=SolarWM MiniMax-H3 H200 Runtime
            org.opencontainers.image.description=Open SolarWM H3 runtime image without model weights or datasets

      - name: Build and publish H3 runtime image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: environments/h3-h200/Dockerfile
          platforms: linux/amd64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            FLASH_ATTN_MAX_JOBS=1
            FLASH_ATTN_NVCC_THREADS=1
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Publish immutable pull command
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '## SolarWM H3 runtime image'
            echo
            echo '```bash'
            echo "docker pull ${IMAGE_NAME}@${DIGEST}"
            echo '```'
            echo
            echo 'This image contains no H3 weights or datasets.'
          } >> "$GITHUB_STEP_SUMMARY"
