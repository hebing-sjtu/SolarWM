# Wan2.2 I2V-A14B high-noise expert Ref2VA proxy inference on the 32 heldout samples, data
# parallel (each rank holds the whole bf16 model with the adapter merged). Pick the stage and
# checkpoint with --set (see the 5B infer config); stage1/stage2 use 4 evaluations per chunk.
schema: solarwm.run.v1
action: infer
name: wan14b-ref2va-infer-81f

model:
  family: wan22_i2v_a14b
  conditioning_mode: ref2va_proxy
  camera_translation_transform: none
  weights: /data/models/Wan2.2-I2V-A14B/high_noise_model
  vae_weights: /data/models/Wan2.2-I2V-A14B/Wan2.1_VAE.pth
  training_mode: lora
  reference_i2v_y: self
  adapter:
    type: lora
    target: main_attention_qkvo
    rank: 128
    alpha: 128
    expected_target_linear_modules: 160

data:
  input_mode: ref2va_preencoded
  data_path: /data/binghe/wan_proxy/manifests/gta0930_omni_a14b_81f_oc_heldout32.txt
  pixel_frames: 81
  fps: 16
  encoded_latents: 21
  height: 480
  width: 832
  latent_height: 60
  latent_width: 104
  proxy_latent_height: 30
  proxy_latent_width: 52
  num_given_latent_frames: 1
  align_proxy_reference_time: false
  oc_reference: true
  oc_drop_prob: 0.0
  chunk_latents: 3
  window_chunks: 6
  train_target_latents: 21
  seed: 42

train:
  stage: stage0p5
  causal_mode: bidirectional
  objective: flow_matching
  anyflow_gate: 0.25
  timestep_shift: 5.0
  keyframe_noise_augmentation: 0.999
  num_denoising_steps: 4

inference:
  stage: stage0p5
  checkpoint:
    path: /workspace/wan_proxy/runs/wan14b-ref2va-stage0p5-oc-81f/checkpoint-000600
    role: student
    weight_source: live
  num_inference_steps: 30
  seed: 0
  fps: 16
  save_latents: true

runtime:
  output_dir: /workspace/wan_proxy/evals/wan14b-ref2va-infer-81f
