# Self-gradient forcing (DMD) LoRA for the mixed-single-reference omni profile.
# The student starts from a Stage1 proxy LoRA and rolls out eight five-latent chunks with four
# denoiser evaluations each through a key/value cache; Stage0.5 proxy LoRAs initialize the
# frozen teacher and the trained critic. All 37 cached latents but the given one are scored.
schema: solarwm.run.v1
action: train
name: minimax-h3-stage2-124f-ref2va-omni-mixed-low-704p-sp2

model:
  family: minimax_h3
  architecture: minimax-h3-33b
  checkpoint_path: /data/models/MiniMax-H3
  transformer_subfolder: transformer_ref
  transformer_device_map: null
  training_mode: lora
  conditioning_mode: ref2va_proxy
  torch_dtype: bfloat16
  load_conditioners: false
  camera_attention_mode: none
  attention_head_dim: 128
  camera_prope_head_dim_start: 96
  camera_prope_head_dim_end: 128
  camera_translation_transform: none
  camera_intrinsics_mode: none
  latent_channels: 24
  latent_height: 44
  latent_width: 80
  rows_per_latent: 880
  num_frames_per_block: 5
  max_prior_clean_chunks: 5
  attention_backend: flex
  adapter:
    type: lora
    target: main_attention_qkvo
    rank: 128
    alpha: 128
    dropout: 0.0
    bias: none
    dtype: bfloat16
    expected_target_linear_modules: 200

data:
  input_mode: proxy_preencoded
  format: fastvideo_pt
  dataset_name: h3_proxy_pt
  data_path: /data/binghe/h3_proxy/cache/omni-mixed-low-704p-qwen2
  preencode_version: h3.ref2va-proxy.124f.v1
  pixel_frames: 124
  encoded_latents: 37
  train_target_latents: 37
  height: 704
  width: 1280
  latent_channels: 24
  latent_height: 44
  latent_width: 80
  proxy_latent_height: 11
  proxy_latent_width: 20
  proxy_variants: [duv, depth, semantic, style]
  proxy_fit: center-crop
  proxy_code_resize: nearest
  audio_latents: 207
  qwen_video_fps: 2
  cwm_system: w0_omni
  num_given_latent_frames: 1
  align_proxy_reference_time: false
  anchor_short_edge: 2048
  seed: 42
  num_workers: 1

distributed:
  world_size: 8
  sequence_parallel_size: 2
  context_parallel_size: 1
  rank_partition: node_shard
  sp_peers_share_sample: true
  sp_peers_share_rng: true

train:
  stage: stage2
  causal_mode: self_gradient_forcing
  objective: flow_matching
  precision: bfloat16
  micro_batch_size: 1
  gradient_accumulation_steps: 1
  global_batch_size: 4
  max_steps: 500
  video_timestep_shift: 12.0
  audio_timestep_shift: 3.0
  keyframe_noise_augmentation: 0.999
  audio_loss_weight: 0.0
  optimizer:
    name: fp32_master_adamw
    learning_rate: 4.0e-6
    betas: [0.0, 0.999]
    epsilon: 1.0e-8
    weight_decay: 0.0
    gradient_clip: 10.0
    warmup_steps: 0
    min_lr_ratio: 1.0
  fsdp:
    sharding_strategy: HYBRID_SHARD
    activation_checkpointing: true
    preserve_checkpoint_dtype: true
    param_dtype: null
    reduce_dtype: float32
    buffer_dtype: null
    frozen_base_shard_size: 8
  critic_updates_per_student: 5
  num_denoising_steps: 4
  per_rank_exit_step: true
  last_step_only: false
  match_context: true
  cache_mode: exit
  tail_camera_policy: none
  audio_condition_policy: fixed_noised_audio_per_rollout
  score_min_sigma: 0.02
  score_max_sigma: 0.98
  critic_optimizer:
    name: fp32_master_adamw
    learning_rate: 8.0e-7
    betas: [0.0, 0.999]
    epsilon: 1.0e-8
    weight_decay: 0.0
    gradient_clip: 10.0
    warmup_steps: 0
    min_lr_ratio: 1.0

validation:
  validate_every_steps: 0
  smoke_step: 0
  media_evaluation: manual_checkpoint_steps
  manual_steps: [100, 250, 500]

checkpoint:
  save_every_steps: 50
  save_optimizer: true
  ema:
    enabled: true
    dtype: float32
    sharded: true
    decay: 0.99
    start_step: 39
    update_every_steps: 1
  initialization:
    student:
      path: /data/binghe/h3_proxy/solarwm-runs/omni-mixed-low-stage1-lora128/checkpoint_model_000600
      weight_source: live
      stage: stage1
    teacher:
      path: /data/binghe/h3_proxy/solarwm-runs/gta0930-r3c-lr2e-4/checkpoint_model_000300
      weight_source: live
      stage: stage0p5
    critic:
      path: /data/binghe/h3_proxy/solarwm-runs/gta0930-r3c-lr2e-4/checkpoint_model_000300
      weight_source: live
      stage: stage0p5

runtime:
  output_dir: /data/binghe/h3_proxy/solarwm-runs/omni-mixed-low-stage2-lora128
  tracking:
    enabled: true
    provider: wandb
    mode: online
    project: solarwm-h3-proxy
    entity: null
    run_name: omni-mixed-low-stage2-lora128
    group: omni-mixed-low-stage2
    tags: [minimax-h3, ref2va, proxy, omni, mixed-single, 704p, stage2, sgf, dmd, lora128]
    run_id: null
    resume: allow
    log_media: false
    loss_ema_beta: 0.95
